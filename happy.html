
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Registration</title>

    <link rel="stylesheet" href="prime.css">
</head>

<body>

    <div class="container">

        <!-- Login Form -->
        <div class="form-box" id="loginBox">

            <h1>Login</h1>
            <p>Welcome back! Please login to your account.</p>

            <form id="loginForm">

                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>

                <div class="input-box password-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="button" class="show-btn" onclick="showPassword('loginPassword', this)">
                        Show
                    </button>
                </div>

                <button type="submit" class="main-btn">
                    Login
                </button>

            </form>

            <p class="switch-text">
                Don't have an account?
                <span onclick="showRegister()">Register</span>
            </p>

            <p id="loginMessage" class="message"></p>

        </div>


        <!-- Registration Form -->
        <div class="form-box hidden" id="registerBox">

            <h1>Create Account</h1>
            <p>Register to create your new account.</p>

            <form id="registerForm">

                <div class="input-box">
                    <input type="text" id="name" placeholder="Full Name" required>
                </div>

                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-box password-box">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="show-btn" onclick="showPassword('password', this)">
                        Show
                    </button>
                </div>

                <div class="input-box">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="main-btn">
                    Register
                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <span onclick="showLogin()">Login</span>
            </p>

            <p id="registerMessage" class="message"></p>

        </div>

    </div>

    <script src="sample.js"></script>

</body>
</html>
